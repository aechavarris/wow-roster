name: Deploy

# Builds the Docker images after CI passes on main and pushes them to GHCR, then rolls them out:
# - on a VPS over SSH when the DEPLOY_* secrets exist, or
# - on a home PC through a self-hosted runner labelled "wow-roster-home" when the repository
#   variable DEPLOY_TARGET is "home" (see README, "Self-hosting on a home PC").
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    # workflow_run's branch filter matches branch names, so a fork PR from a branch called "main"
    # would pass it: only CI runs from pushes to this repository may publish and deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [migrate, api, worker, web]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    needs: images
    if: vars.DEPLOY_TARGET != 'home'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
        if: env.DEPLOY_HOST != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Skip (no server configured)
        if: env.DEPLOY_HOST == ''
        run: echo "::notice::DEPLOY_HOST secret not set; images were published but nothing was deployed."
      - name: Copy compose files
        if: env.DEPLOY_HOST != ''
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: docker-compose.prod.yml,deploy/Caddyfile
          target: ${{ secrets.DEPLOY_PATH || '/opt/wow-roster' }}
      - name: Roll out
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/wow-roster' }}
            export IMAGE_PREFIX=ghcr.io/${{ github.repository }} IMAGE_TAG=${{ github.event.workflow_run.head_sha || github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

  deploy-home:
    needs: images
    if: vars.DEPLOY_TARGET == 'home'
    # Self-hosted Linux runner on the home box (SteamOS / any Linux), labelled wow-roster-home.
    runs-on: [self-hosted, wow-roster-home]
    environment: production
    # The images are public (the repository is open source), so the box pulls them without
    # registry credentials.
    permissions:
      contents: read
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Empty unless overridden; the steps fall back to $HOME/wow-roster-prod.
      HOME_DEPLOY_PATH: ${{ vars.HOME_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Copy compose files
        run: |
          set -euo pipefail
          DEPLOY_PATH="${HOME_DEPLOY_PATH:-$HOME/wow-roster-prod}"
          echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"
          [ -f "$DEPLOY_PATH/.env" ] || { echo "Missing $DEPLOY_PATH/.env (see deploy/home.env.example)" >&2; exit 1; }
          mkdir -p "$DEPLOY_PATH/deploy"
          # Pin the deployed image tag in .env so every later `docker compose up -d` (a reboot or a
          # manual run) resolves the same sha instead of IMAGE_TAG's default `latest`, which could be
          # an older image cached on the box and would silently revert the stack to a previous build.
          { grep -v '^[[:space:]]*IMAGE_TAG[[:space:]]*=' "$DEPLOY_PATH/.env" || true; echo "IMAGE_TAG=$IMAGE_TAG"; } > "$DEPLOY_PATH/.env.tmp"
          mv "$DEPLOY_PATH/.env.tmp" "$DEPLOY_PATH/.env"
          # Caddy and Tailscale only read their bind-mounted config at start, and compose does not
          # recreate a container when a mounted file changes: note which ones need recreating.
          changed=""
          for pair in Caddyfile:caddy tailscale-serve.json:tailscale; do
            file="${pair%%:*}"; svc="${pair##*:}"; target="$DEPLOY_PATH/deploy/$file"
            if [ ! -f "$target" ] || [ "$(sha256sum < "deploy/$file")" != "$(sha256sum < "$target")" ]; then
              changed="$changed $svc"
            fi
          done
          echo "RECREATE_SERVICES=$(echo $changed | xargs)" >> "$GITHUB_ENV"
          cp docker-compose.prod.yml docker-compose.home.yml "$DEPLOY_PATH/"
          cp deploy/Caddyfile deploy/tailscale-serve.json "$DEPLOY_PATH/deploy/"
      - name: Roll out
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          compose=(docker compose -f docker-compose.prod.yml -f docker-compose.home.yml)
          "${compose[@]}" pull
          "${compose[@]}" up -d --remove-orphans
          if [ -n "${RECREATE_SERVICES:-}" ]; then
            echo "Config changed, recreating:$RECREATE_SERVICES"
            "${compose[@]}" up -d --force-recreate $RECREATE_SERVICES
          fi
          docker image prune -f
