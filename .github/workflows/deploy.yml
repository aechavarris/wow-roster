name: Deploy

# Builds the Docker images after CI passes on main and pushes them to GHCR, then rolls them out:
# - on a VPS over SSH when the DEPLOY_* secrets exist, or
# - on a home PC through a self-hosted runner labelled "wow-roster-home" when the repository
#   variable DEPLOY_TARGET is "home" (see README, "Self-hosting on a home PC").
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    # workflow_run's branch filter matches branch names, so a fork PR from a branch called "main"
    # would pass it: only CI runs from pushes to this repository may publish and deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [migrate, api, worker, web]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    needs: images
    if: vars.DEPLOY_TARGET != 'home'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
        if: env.DEPLOY_HOST != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Skip (no server configured)
        if: env.DEPLOY_HOST == ''
        run: echo "::notice::DEPLOY_HOST secret not set; images were published but nothing was deployed."
      - name: Copy compose files
        if: env.DEPLOY_HOST != ''
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: docker-compose.prod.yml,deploy/Caddyfile
          target: ${{ secrets.DEPLOY_PATH || '/opt/wow-roster' }}
      - name: Roll out
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/wow-roster' }}
            export IMAGE_PREFIX=ghcr.io/${{ github.repository }} IMAGE_TAG=${{ github.event.workflow_run.head_sha || github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

  deploy-home:
    needs: images
    if: vars.DEPLOY_TARGET == 'home'
    runs-on: [self-hosted, wow-roster-home]
    environment: production
    # The images are public (the repository is open source), so the PC pulls them without
    # registry credentials; GHCR rejected the job's GITHUB_TOKEN from the Windows runner.
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    env:
      DEPLOY_PATH: ${{ vars.HOME_DEPLOY_PATH || 'C:\wow-roster-prod' }}
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Copy compose files
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "$env:DEPLOY_PATH\.env")) { throw "Missing $env:DEPLOY_PATH\.env (see deploy/home.env.example)" }
          New-Item -ItemType Directory -Force "$env:DEPLOY_PATH\deploy" | Out-Null
          # Caddy and Tailscale only read their bind-mounted config at start, and compose does not
          # recreate a container when a mounted file changes: note which ones need recreating.
          $changed = @()
          foreach ($pair in @(@('Caddyfile', 'caddy'), @('tailscale-serve.json', 'tailscale'))) {
            $target = "$env:DEPLOY_PATH\deploy\$($pair[0])"
            if (-not (Test-Path $target) -or (Get-FileHash "deploy\$($pair[0])").Hash -ne (Get-FileHash $target).Hash) { $changed += $pair[1] }
          }
          "RECREATE_SERVICES=$($changed -join ' ')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Copy-Item docker-compose.prod.yml, docker-compose.home.yml $env:DEPLOY_PATH -Force
          Copy-Item deploy\Caddyfile, deploy\tailscale-serve.json, deploy\home-resume.ps1, deploy\register-resume-task.ps1 "$env:DEPLOY_PATH\deploy" -Force
      - name: Roll out
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:DEPLOY_PATH
          docker compose -f docker-compose.prod.yml -f docker-compose.home.yml pull
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          docker compose -f docker-compose.prod.yml -f docker-compose.home.yml up -d --remove-orphans
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:RECREATE_SERVICES) {
            $services = $env:RECREATE_SERVICES -split ' '
            Write-Output "Config changed, recreating: $services"
            docker compose -f docker-compose.prod.yml -f docker-compose.home.yml up -d --force-recreate @services
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          docker image prune -f
